.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
/* Palette from "Aturan Font & Warna": white dominant, Biru Aksen accent. */
:root{
  --putih:#FFFFFF; --aksen:#29A9DC; --gelap:#0B4F6C; --pastel:#D6F0FA; --terang:#F4FBFE;
  --teks:#1E3A4A; --teks2:#6B8794; --tawar:#F6D978; --tawar-tepi:#D9B44A; --mint:#E3F6EF;
  --shadow:0 16px 40px rgba(11,79,108,0.08);
}
.iso[data-theme="light"]{
  --anatomy-page:#FFFFFF;--anatomy-card:#FFFFFF;--anatomy-paper:#FFFFFF;--anatomy-face:#FFFFFF;--anatomy-top:#FFFFFF;
  --anatomy-shade-0:#C9DEE8;--anatomy-shade-1:#D8E8EF;--anatomy-shade-2:#E6F1F6;--anatomy-shade-3:#F1F8FB;
  --anatomy-lit-top:#FFFFFF;--anatomy-lit-shade:#E6F4FA;
  --anatomy-hi:#2C4A5A;--anatomy-mid:#7F9AA6;--anatomy-lo:#A9C0CA;--anatomy-faint:#D3E3EA;--anatomy-lit:#0B4F6C;
  --anatomy-halo:#6B8794;--anatomy-halo-opacity:.22;--anatomy-dot:#1E3A4A;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:"Poppins","Montserrat",sans-serif;color:var(--teks)}
#frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 55%,var(--terang) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.b1{width:760px;height:760px;left:-220px;top:-260px;background:var(--pastel)}
.b2{width:620px;height:620px;right:-180px;top:-120px;background:var(--mint);opacity:.5}
.b3{width:900px;height:500px;left:520px;bottom:-320px;background:var(--pastel);opacity:.45}
#stage{position:absolute;inset:0}
#world{position:absolute;inset:0;width:1920px;height:1080px}
#overlay{position:absolute;inset:0;pointer-events:none}
#labels,#panels{position:absolute;inset:0;pointer-events:none}

/* world styling */
.sea-front,.sea-side{fill:url(#seaGrad);stroke:#29A9DC;stroke-opacity:.5;stroke-width:.8}
.sea-top{fill:#BFE6F6;fill-opacity:.45;stroke:#29A9DC;stroke-opacity:.55;stroke-width:.8}
.waves{fill:none;stroke:#29A9DC;stroke-width:1.2;stroke-linecap:round;opacity:.7}
.hull-recess{fill:#A8D8EC}
.hull-hole{fill:#0B4F6C;opacity:.55}
.hmi{fill:var(--gelap)}
.lamp{fill:var(--aksen)}
#world [data-part]{transition:none}
#world .hlp .iso-edge{stroke:var(--aksen)}
#world .hlp .iso-top{fill:#EAF7FD}
#world .hlp .iso-shade[data-shade="3"]{fill:#DDF2FB}
#world .hlp .iso-shade[data-shade="2"]{fill:#CFECF8}
#world .hlp .iso-shade[data-shade="1"]{fill:#BFE4F4}
#world .hlp .iso-shade[data-shade="0"]{fill:#AED9EE}
#world .hlp .iso-solid[data-seamless]>.iso-shade{stroke:none}
#world .hlp .tb-body{fill:#CFECF8}

/* water */
.w-edge{fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-core{fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-dash{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.sw .w-edge{stroke:#0B4F6C;stroke-opacity:.18}
.sw .w-core{stroke:var(--aksen)}
.fw .w-edge{stroke:var(--tawar-tepi)}
.fw .w-core{stroke:var(--tawar)}
.sig .w-core{stroke:var(--aksen)}
.chev{fill:#fff;stroke-linejoin:round}
.sw .chev{stroke:var(--aksen)}
.fw .chev{stroke:var(--tawar-tepi)}
.pdot{fill:var(--aksen)}
.pdot.warm{fill:#5BBFE6}

/* glass */
.glass{position:absolute;background:rgba(255,255,255,.80);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid var(--pastel);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}

/* header */
#head{position:absolute;left:72px;top:56px;padding:22px 34px 24px;max-width:1100px}
#head::before{content:"";position:absolute;inset:0;border-radius:28px;background:rgba(255,255,255,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--pastel);box-shadow:var(--shadow);z-index:-1}
.lt{font-weight:700;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:var(--aksen);line-height:1.2}
h1{margin:4px 0 0;font-weight:600;font-size:64px;line-height:1.12;color:var(--gelap)}
i,em{font-style:italic}
#section{position:absolute;right:72px;top:64px;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
#stepNo{font-weight:500;font-size:24px;color:var(--teks2);letter-spacing:.5px}
#steps{display:flex;gap:10px;padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--pastel);box-shadow:var(--shadow)}
.step{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--terang);border:1px solid var(--pastel)}
.step svg{width:26px;height:26px}
.step.on{background:var(--aksen);border-color:var(--aksen)}
.step.on svg *{stroke:#fff}
.step.done{background:var(--pastel)}
#subtitle{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:1480px;display:flex;justify-content:center}
#subText{margin:0;padding:22px 40px;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);border:1px solid var(--pastel);
  font-weight:600;font-size:36px;line-height:1.38;color:var(--gelap);text-align:center;max-width:1480px}
#brand{position:absolute;left:72px;bottom:28px;font-weight:500;font-size:20px;letter-spacing:2px;color:var(--teks2);opacity:0}

/* callouts */
.callout{position:absolute;display:flex;align-items:center;gap:12px;padding:10px 20px 10px 12px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--pastel);box-shadow:var(--shadow);
  font-weight:500;font-size:28px;color:var(--gelap);transform-origin:left center}
.callout .ic{width:44px;height:44px;border-radius:50%;background:var(--terang);border:1px solid var(--pastel);display:grid;place-items:center}
.callout .ic svg{width:28px;height:28px}
.callout small{display:block;font-weight:400;font-size:22px;color:var(--teks2);margin-top:-2px}
.ic svg *{fill:none;stroke:var(--gelap);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic svg .acc{stroke:var(--aksen)}
.lead{stroke:var(--gelap);stroke-width:1.6;fill:none;stroke-opacity:.6}
.anchor{fill:#fff;stroke:var(--aksen);stroke-width:3}
.anchor-core{fill:var(--aksen)}

/* panels */
.panel{position:absolute;overflow:hidden}
.panel h3{margin:0;font-weight:600;font-size:36px;color:var(--gelap)}
.panel .cap{font-weight:400;font-size:24px;color:var(--teks2)}
.tag{font-family:"Poppins";font-weight:500;fill:var(--gelap)}
.tag2{font-family:"Poppins";font-weight:400;fill:var(--teks2)}
.num{font-family:"Poppins";font-weight:700;fill:var(--aksen)}
.step svg *{fill:none;stroke:var(--gelap);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.step svg .acc{stroke:var(--aksen)}
.step.on svg .acc{stroke:#fff}
svg.ic *{fill:none;stroke:var(--gelap);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic .acc{stroke:var(--aksen)}
</style></head>

<script>const DATA = {"scenes":[{"id":"hull","title":"Air laut masuk","sub":"Air laut masuk lewat <i>sea chest</i>, lubang di lambung kapal yang dilindungi saringan.","start":0,"dur":5.58,"voice":0.35},{"id":"suction","title":"Pipa isap","sub":"Lewat pipa isap, air mengalir ke pompa. Pompa harus terisi penuh air dulu, baru bisa bekerja.","start":5.58,"dur":6.97,"voice":5.93},{"id":"pump","title":"Pompa dari luar","sub":"Motor listrik di satu sisi, rumah spiral (<i>volute</i>) di sisi lain, dan poros di antaranya.","start":12.55,"dur":6.38,"voice":12.9},{"id":"bearing","title":"Di dalam <i>bearing</i>","sub":"<i>Bearing</i>, penopang poros di belakang <i>impeller</i>, bekerja seperti jalur bola: poros berputar halus, gesekannya kecil.","start":18.93,"dur":9,"voice":19.28},{"id":"drive","title":"Penggerak","sub":"Motor memutar poros, poros memutar <i>impeller</i>.","start":27.93,"dur":3.68,"voice":28.28},{"id":"impeller","title":"<i>Impeller</i>","sub":"<i>Impeller</i> (roda bersudu) seperti kipas: air ditarik di tengah, dilempar ke luar oleh gaya sentrifugal. Tekanan dan kecepatan naik.","start":31.62,"dur":10.56,"voice":31.97},{"id":"volute","title":"<i>Volute</i> dan pipa buang","sub":"Air masuk ke rumah spiral yang makin lebar, lalu keluar lewat pipa buang.","start":42.18,"dur":5.38,"voice":42.53},{"id":"cooler","title":"<i>Central cooler</i>","sub":"Penukar panas ini mirip radiator: air laut menyerap panas dari air tawar pendingin, yang tadi mengambil panas dari mesin induk.","start":47.56,"dur":10,"voice":47.91},{"id":"overboard","title":"Kembali ke laut","sub":"Air laut yang sudah hangat dibuang kembali ke laut.","start":57.56,"dur":5,"voice":57.91},{"id":"monitor","title":"Sensor dan monitoring","sub":"Sensor RPM membaca kecepatan putar poros. Datanya dikirim ke PLC, komputer kendali, lalu tampil di layar monitoring.","start":62.56,"dur":10,"voice":62.91},{"id":"summary","title":"Ringkasan","sub":"Air laut tidak menjadi bagian mesin. Ia hanya membawa panas dar const gArc = hsvg.querySelector("#gArc"), gTrack = hsvg.querySelector("#gTrack"), rpmNum = hsvg.querySelector("#rpmNum"), spark = hsvg.querySelector("#spark");
const arcD = (f) => { const a0 = Math.PI * 0.82, a1 = Math.PI * 2.18; const a = lerp(a0, a1, f); const R = 200; const p0 = [Math.cos(a0) * R, Math.sin(a0) * R], p1 = [Math.cos(a) * R, Math.sin(a) * R]; return `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}A${R} ${R} 0 ${a - a0 > Math.PI ? 1 : 0} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`; };
gTrack.setAttribute("d", arcD(1));
const TILES = [
  { k: "Tekanan pipa buang", v: (g) => fmt(lerp(0, 2.5, g), 1) + " bar" },
  { k: "Air laut masuk", v: () => "32 °C" },
  { k: "Air laut keluar", v: () => "42 °C" },
];

const tileVals = TILES.map((T, i) => {
  const g = el("g", { transform: `translate(${i * 216} 0)` }, tilesG);
  el("rect", { width: 200, height: 220, rx: 22, fill: "#F4FBFE", stroke: "#D6F0FA" }, g);
  const k = el("text", { x: 20, y: 44, class: "tag2", "font-size": 19 }, g); k.textContent = T.k;
  const v = el("text", { x: 20, y: 120, class: "num", "font-size": 44, fill: "#0B4F6C" }, g);
  const st = el("text", { x: 20, y: 186, class: "tag2", "font-size": 18 }, g); st.textContent = "normal";
  el("circle", { cx: 176, cy: 180, r: 7, fill: "#29A9DC" }, g);
  return v;
});
const pulse1 = hsvg.querySelector("#pulse1"), pulse2 = hsvg.querySelector("#pulse2");
const RPM = 1780;
function drawHMI(t, u) {
  const g = smooth(seg(u, 0.4, 2.2));
  const rpm = RPM * g + Math.sin(t * 3.1) * 4 * g;
  gArc.setAttribute("d", arcD(Math.max(0.002, rpm / 2000)));
  rpmNum.textContent = fmt(rpm);
  tileVals.forEach((v, i) => (v.textContent = TILES[i].v(g)));
  const pts = [];
  for (let i = 0; i <= 60; i++) { const x = (i / 60) * 620 + 10; const tt = t - (60 - i) * 0.05; const gg = smooth(seg(tt - (t - u), 0.4, 2.2)); const r = RPM * gg + Math.sin(tt * 3.1) * 4 * gg; pts.push([x, 14 + 80 - (r / 2000) * 70]); }
  spark.setAttribute("d", "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L"));
  const k1 = (t * 0.9) % 1, k2 = (t * 0.9 + 0.5) % 1;
  pulse1.setAttribute("cx", (262 + 80 * k1).toFixed(1)); pulse1.setAttribute("opacity", Math.sin(k1 * Math.PI).toFixed(3));
  pulse2.setAttribute("cx", (556 + 80 * k2).toFixed(1)); pulse2.setAttribute("opacity", Math.sin(k2 * Math.PI).toFixed(3));
}

// Summary card ---------------------------------------------------------------------
const PS = panel("summary", { x: 360, y: 300, w: 1200, h: 420 });
PS.div.innerHTML = `<svg width="1200" height="420" viewBox="0 0 1200 420">
<text x="600" y="74" text-anchor="middle" class="tag" font-size="22" fill="#6B8794" letter-spacing="2">RINGKASAN</text>
${[["drop", "Air laut masuk", "lewat sea chest"], ["hx", "Menyerap panas", "di central cooler"], ["wave", "Kembali ke laut", "membawa panas"]].map(([ic, a, b], i) => `

  <circle cx="130" cy="70" r="44" fill="#fff" stroke="#D6F0FA"/>

  <text x="130" y="158" text-anchor="middle" class="tag" font-size="26">${a}</text>

</g>${i < 2 ? `<path class="sumArrow" d="M${130 + i * 360 + 276} 235h68m-14 -12l14 12l-14 12" fill="none" stroke="#29A9DC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` : ""}`).join("")}
</svg>`;
const sumSteps = [...PS.div.querySelectorAll(".sumStep")], sumArrows = [...PS.div.querySelectorAll(".sumArrow")];
PS.div.querySelectorAll(".ic").forEach((g) => g.setAttribute("style", ""));

// ---- sea waves ---------------------------------------------------------------
const waves = $("waves");
const seaTop = document.querySelector(".sea-top").getAttribute("d").match(/-?\d+(\.\d+)?/g).map(Number);
function drawWaves(t) {
  // front edge of the sea top: from point 3 to point 2 (x0,y+d) -> (x0+w,y+d)
  const a = [seaTop[6], seaTop[7]], b = [seaTop[4], seaTop[5]];
  const n = 60, pts = [];
  for (let i = 0; i <= n; i++) { const k = i / n; pts.push([lerp(a[0], b[0], k), lerp(a[1], b[1], k) + Math.sin(k * 26 + t * 2.2) * 1.6]); }
  const pts2 = [];
  for (let i = 0; i <= n; i++) { const k = i / n; pts2.push([lerp(a[0], b[0], k) + 30, lerp(a[1], b[1], k) - 22 + Math.sin(k * 22 - t * 1.8) * 1.3]); }
  waves.setAttribute("d", "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "M" + pts2.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L"));
}

// ---- master seek ---------------------------------------------------------------
function sceneAt(t) { for (let i = DATA.scenes.length - 1; i >= 0; i--) if (t >= DATA.scenes[i].start) return i; return 0; }
function camAt(t) {
  const i = sceneAt(t);
  const sc = DATA.scenes[i];
  return CAM[sc.id](t - sc.start, sc.dur);
}
window.seek = function (t) {
  const i = sceneAt(t);
  const sc = DATA.scenes[i];
  const u = t - sc.start, d = sc.dur;
  setCamera(camAt(t));
  setScene(i, u, d);

  // water fill schedule (global)
  const F = (id, a, b) => seg(t, s(id) + a, s(id) + b);
  setFlow("sea", F("hull", 1.0, 4.4), t);
  setFlow("strainer", F("suction", -0.6, 0.6), t);
  setFlow("suction", F("suction", 0.4, 2.6), t);
  const primeF = F("suction", 2.4, 4.6);
  const py = lerp(primeBox[1], primeBox[0], smooth(primeF));
  primeRect.setAttribute("y", py.toFixed(1)); primeRect.setAttribute("height", (primeBox[1] - py + 2).toFixed(1));
  prime.style.display = primeF > 0 ? "" : "none";
  prime.setAttribute("opacity", (1 - 0.75 * seg(t, s("pump"), s("pump") + 1.2)).toFixed(3));
  setFlow("pump", F("volute", 0, 1.2), t);
  setFlow("discharge", F("volute", d * 0 + SC.volute.dur - 2.2, SC.volute.dur + 1.2), t);
  setFlow("coolerSw", F("cooler", 1.0, 2.6), t);
  setFlow("engine", F("cooler", 1.6, 3.0), t);
  setFlow("fwHot", F("cooler", 2.4, 3.8), t);
  setFlow("coolerFw", F("cooler", 3.4, 4.6), t);
  setFlow("fwCold", F("cooler", 4.2, 5.6), t);
  setFlow("overboard", F("overboard", 0.3, 2.6), t);
  setFlow("cable", F("monitor", 1.6, 3.4), t, 60);

  // shaft rotation once primed
  const running = t > s("suction") + 4.6;
  const spin = running ? Math.min(1, (t - s("suction") - 4.6) / 1.5) : 0;
  const phaseRev = running ? 0.55 * (t - s("suction") - 4.6) - 0.55 * 0.75 * (1 - spin) : 0;
  setRot(((Math.floor(phaseRev * 6 * DATA.rotFrames) % DATA.rotFrames) + DATA.rotFrames) % DATA.rotFrames);
  axisLine.setAttribute("opacity", (smooth(seg(u, 0.4, 0.9)) * (sc.id === "drive" ? 1 : 0)).toFixed(3));
  axisLine.setAttribute("stroke-dashoffset", (t * 40).toFixed(1));

  // highlights
  const HL = {
    hull: ["hull"], suction: ["strainer"], pump: ["motor", "shaft", "volute", "frame"], bearing: ["frame"], drive: ["motor", "shaft", "volute"],
    impeller: ["volute"], volute: ["volute"], cooler: ["cooler", "engine"], overboard: ["hull"], monitor: ["sensor", "plc", "cable"], summary: [],
  };
  highlight(HL[sc.id] || []);

  // particles in the sea (inflow) and at the outlet (warm outflow)
  const seaVis = Math.max(1 - seg(t, s("pump"), s("pump") + 1), seg(t, s("overboard"), s("overboard") + 1)) * seg(t, 0.4, 1.6);
  DATA.seaParticles.forEach((q, k) => {
    const ph = (t / 3.2 + q.ph) % 1;
    const p = [lerp(q.a[0], q.b[0], ph), lerp(q.a[1], q.b[1], ph)];
    seaDots[k].setAttribute("cx", p[0].toFixed(1)); seaDots[k].setAttribute("cy", p[1].toFixed(1));
    seaDots[k].setAttribute("opacity", (seaVis * Math.sin(ph * Math.PI) * 0.9).toFixed(3));
  });
  const outVis = seg(t, s("overboard") + 2.2, s("overboard") + 3.0);
  DATA.outParticles.forEach((q, k) => {
    const ph = (t / 2.6 + q.ph) % 1;
    const p = [lerp(q.a[0], q.b[0], ph), lerp(q.a[1], q.b[1], ph)];
    outDots[k].setAttribute("cx", p[0].toFixed(1)); outDots[k].setAttribute("cy", p[1].toFixed(1));
    outDots[k].setAttribute("opacity", (outVis * Math.sin(ph * Math.PI) * 0.9).toFixed(3));
  });
  // signal pulses along the cable
  const cab = FLOW.cable;
  const sigVis = seg(t, s("monitor") + 3.2, s("monitor") + 3.6) * (1 - seg(t, s("summary"), s("summary") + 0.5));
  sigDots.forEach((dot, k) => {
    const ph = (t * 0.55 + k / 4) % 1;
    const { p } = pointAt(cab.pts, cab.acc, ph * cab.acc[cab.acc.length - 1]);
    dot.setAttribute("cx", p[0].toFixed(1)); dot.setAttribute("cy", p[1].toFixed(1));
    dot.setAttribute("opacity", (sigVis * Math.sin(ph * Math.PI)).toFixed(3));
  });
  const hmiOn = seg(t, s("monitor") + 3.6, s("monitor") + 4.0);
  hmi.style.fill = hmiOn > 0 ? `rgb(${Math.round(lerp(11, 41, hmiOn))},${Math.round(lerp(79, 169, hmiOn))},${Math.round(lerp(108, 220, hmiOn))})` : "";
  lamps.forEach((l, k) => l.setAttribute("opacity", (hmiOn > 0 ? 0.4 + 0.6 * (Math.sin(t * 5 + k) > 0 ? 1 : 0.2) : 1).toFixed(2)));
  drawWaves(t);

  // callouts
  for (const id of Object.keys(CALL)) drawCallout(id, t);
  // prime callout shows a % fill
  CALL.prime.div.querySelector("span:last-child").innerHTML = `Pompa terisi air <b style="color:#29A9DC">${Math.round(smooth(primeF) * 100)}%</b>`;

  // panels
  const bVis = Math.min(seg(t, s("bearing") + 1.15, s("bearing") + 2.0), 1 - seg(t, e_("bearing") - 1.25, e_("bearing") - 0.35));
  showPanel(PB, bVis, toScreen(A.bearing));
  if (bVis > 0) drawBearing(t, t - s("bearing"));
  const iVis = Math.min(seg(t, s("impeller") + 1.05, s("impeller") + 1.9), 1 - seg(t, e_("volute") - 2.6, e_("volute") - 1.9));
  showPanel(PI_, iVis, toScreen(A.volute));
  if (iVis > 0) drawImpeller(t, t - s("impeller"), t >= s("volute"));
  const cVis = Math.min(seg(t, s("cooler") + 4.0, s("cooler") + 4.8), 1 - seg(t, e_("cooler") - 0.6, e_("cooler")));
  showPanel(PC, cVis, toScreen(A.coolerHead));
  if (cVis > 0) drawCooler(t, t - s("cooler"));
  const hVis = Math.min(seg(t, s("monitor") + 5.0, s("monitor") + 5.8), 1 - seg(t, e_("monitor") - 0.35, e_("monitor")));
  showPanel(PH, hVis, toScreen(A.screen));
  if (hVis > 0) drawHMI(t, t - s("monitor") - 5.0);
  const sVis = seg(t, s("summary") + 1.6, s("summary") + 2.4);
  showPanel(PS, sVis, [960, 540]);
  sumSteps.forEach((g, k) => g.setAttribute("opacity", smooth(seg(t, s("summary") + 2.2 + k * 0.5, s("summary") + 2.7 + k * 0.5)).toFixed(3)));
  sumArrows.forEach((g, k) => g.setAttribute("opacity", smooth(seg(t, s("summary") + 2.5 + k * 0.5, s("summary") + 2.9 + k * 0.5)).toFixed(3)));
  $("brand").style.opacity = (0.9 * smooth(seg(t, 0.3, 1.2))).toFixed(3);
  // whole-frame fade in/out

window.TOTAL = DATA.total;
const q = new URLSearchParams(location.search);
if (q.has("t")) seek(Number(q.get("t")));
else if (q.has("play")) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DATA.total); requestAnimationFrame(loop); }; loop(); }
